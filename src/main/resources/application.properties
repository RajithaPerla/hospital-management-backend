# =========================================================
# application.properties
# All secrets/URLs come from environment variables so nothing
# sensitive is committed to git. Set these in the Render
# dashboard under "Environment".
# =========================================================

spring.application.name=hospital-management-backend
server.port=${PORT:8080}

# --- Neon PostgreSQL connection ---
# Neon connection strings look like:
# postgresql://<user>:<password>@<host>/<db>?sslmode=require
# We split it into JDBC-friendly pieces via env vars on Render:
#   DB_URL=jdbc:postgresql://<host>/<db>?sslmode=require
#   DB_USERNAME=<user>
#   DB_PASSWORD=<password>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Neon free tier connections are precious - keep the pool small.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate should only validate it, never auto-generate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Firebase ---
# Path to the Firebase service account JSON. On Render, store the JSON
# content itself in an env var (FIREBASE_SERVICE_ACCOUNT_JSON) and write
# it to disk at startup (see FirebaseConfig) rather than committing a file.
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}
firebase.project-id=${FIREBASE_PROJECT_ID}

# --- CORS ---
# Comma-separated list, read by CorsConfig
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# --- Logging ---
logging.level.org.springframework.security=INFO
logging.level.com.hospital=INFO
